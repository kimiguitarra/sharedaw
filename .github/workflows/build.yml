name: Build

on:
  push:
    branches: [ main, "claude/**" ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ロジック部分の単体テスト（JUCE 不要なので速い）
  core-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check Japanese string literals
        run: python3 tools/check_literals.py
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCOLLAB_BUILD_APP=OFF
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  app:
    name: app (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-2022
            configure: -G "Visual Studio 17 2022" -A x64
          - name: macos-universal
            os: macos-14
            configure: -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          - name: linux
            os: ubuntu-24.04
            configure: -G Ninja -DCMAKE_BUILD_TYPE=Release

    steps:
      - uses: actions/checkout@v4

      # Tracktion Engine の .gitmodules が JUCE を SSH の URL で参照しているため HTTPS に読み替える
      - name: Checkout submodules
        shell: bash
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive --depth 1 --jobs 8

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libjack-jackd2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
            libgl1-mesa-dev libcurl4-openssl-dev xvfb

      - name: Configure
        shell: bash
        run: cmake -S . -B build ${{ matrix.configure }}

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel 4

      - name: Core tests
        shell: bash
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Render smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          cp -r shared/fixtures/demo-project /tmp/demo
          xvfb-run -a ./build/app/CollabDAW_artefacts/Release/CollabDAW --render /tmp/demo /tmp/demo.wav

      - name: Check universal binary (macOS)
        if: runner.os == 'macOS'
        run: lipo -info build/app/CollabDAW_artefacts/Release/CollabDAW.app/Contents/MacOS/CollabDAW

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp -r build/app/CollabDAW_artefacts/Release/CollabDAW.exe build/app/CollabDAW_artefacts/Release/assets dist/
          elif [ "$RUNNER_OS" = "macOS" ]; then
            ditto build/app/CollabDAW_artefacts/Release/CollabDAW.app dist/CollabDAW.app
          else
            cp -r build/app/CollabDAW_artefacts/Release/CollabDAW build/app/CollabDAW_artefacts/Release/assets dist/
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: CollabDAW-${{ matrix.name }}
          path: dist
          retention-days: 14
