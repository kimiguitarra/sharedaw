name: Build

# Actions の無料枠を節約する:
# - push / PR では Linux の軽いテスト（ロジックの単体テスト・同期サーバー）だけを動かす
# - アプリのビルド（特に macOS は Linux の 10 倍の分数を消費する）は手動実行（Actions → Build → Run workflow）のときだけ
on:
  push:
    branches: [ main ]
    paths-ignore: [ "**.md", "docs/**" ]
  pull_request:
    paths-ignore: [ "**.md", "docs/**" ]
  workflow_dispatch:
    inputs:
      windows:
        description: "Windows 版をビルドする"
        type: boolean
        default: true
      macos:
        description: "Mac 版（Universal）をビルドする（分数の消費が大きい）"
        type: boolean
        default: true
      linux:
        description: "Linux 版をビルドしてスモークテストする"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ロジック部分の単体テスト（JUCE 不要なので速い）
  core-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check Japanese string literals
        run: python3 tools/check_literals.py
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCOLLAB_BUILD_APP=OFF
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  # 同期サーバー（Cloudflare Workers）の型チェックと結合テスト
  server:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # 手動実行で選んだ OS だけをビルドする
  plan:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        env:
          WINDOWS: ${{ inputs.windows }}
          MACOS: ${{ inputs.macos }}
          LINUX: ${{ inputs.linux }}
        run: |
          entries=()
          [ "$WINDOWS" = "true" ] && entries+=('{"name":"windows","os":"windows-2022","configure":"-G \"Visual Studio 17 2022\" -A x64"}')
          [ "$MACOS" = "true" ] && entries+=('{"name":"macos-universal","os":"macos-14","configure":"-G Xcode -DCMAKE_OSX_ARCHITECTURES=\"arm64;x86_64\""}')
          [ "$LINUX" = "true" ] && entries+=('{"name":"linux","os":"ubuntu-24.04","configure":"-G Ninja -DCMAKE_BUILD_TYPE=Release -DCOLLAB_BUILD_TEST_PLUGINS=ON"}')
          json="$(IFS=,; echo "{\"include\":[${entries[*]}]}")"
          echo "$json"
          echo "matrix=$json" >> "$GITHUB_OUTPUT"

  app:
    needs: plan
    if: needs.plan.outputs.matrix != '{"include":[]}'
    name: app (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      # Tracktion Engine の .gitmodules が JUCE を SSH の URL で参照しているため HTTPS に読み替える
      - name: Checkout submodules
        shell: bash
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive --depth 1 --jobs 8

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libjack-jackd2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
            libgl1-mesa-dev libcurl4-openssl-dev xvfb

      # ASIO（§3.5）: Steinberg の ASIO SDK を取得できたときだけ有効にする（取れなければ WASAPI のみ）
      - name: ASIO SDK (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          if curl -fsSL --retry 3 -o asiosdk.zip https://www.steinberg.net/asiosdk && unzip -q asiosdk.zip -d asiosdk; then
            header="$(find asiosdk -name iasiodrv.h | head -1)"
            if [ -n "$header" ]; then
              echo "ASIO_CONFIG=-DCOLLAB_ASIO_SDK_DIR=$(cd "$(dirname "$header")/.." && pwd -W)" >> "$GITHUB_ENV"
              exit 0
            fi
          fi
          echo "::warning::ASIO SDK could not be downloaded; building without ASIO (WASAPI only)"

      - name: Configure
        shell: bash
        run: cmake -S . -B build ${{ matrix.configure }} $ASIO_CONFIG

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel 4

      - name: Core tests
        shell: bash
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Render smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          cp -r shared/fixtures/demo-project /tmp/demo
          xvfb-run -a ./build/app/ShareDAW_artefacts/Release/ShareDAW --render /tmp/demo /tmp/demo.wav

      - name: Plugin smoke test (Linux)
        if: runner.os == 'Linux'
        run: tools/plugin-smoke-test.sh "$PWD/build/app/ShareDAW_artefacts/Release/ShareDAW" "$PWD/build"

      - name: Check universal binary (macOS)
        if: runner.os == 'macOS'
        run: lipo -info build/app/ShareDAW_artefacts/Release/ShareDAW.app/Contents/MacOS/ShareDAW

      # Apple Developer に登録しないので、アドホック署名（証明書なし）にする。Apple Silicon は署名のないアプリを起動できない。
      # Hardened Runtime とマイク・他社プラグイン読み込みの entitlements も付ける（仕様書 §8.3, §11）
      - name: Ad-hoc sign (macOS)
        if: runner.os == 'macOS'
        run: |
          app=build/app/ShareDAW_artefacts/Release/ShareDAW.app
          entitlements="$(find build -name 'ShareDAW.entitlements' | head -1)"
          echo "entitlements: $entitlements"
          codesign --force --deep --options runtime --entitlements "$entitlements" --sign - "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -d --entitlements - "$app"

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp -r build/app/ShareDAW_artefacts/Release/ShareDAW.exe build/app/ShareDAW_artefacts/Release/assets dist/
          elif [ "$RUNNER_OS" = "macOS" ]; then
            # アーティファクトの zip は実行権限を保持しないので、dmg にして渡す
            mkdir -p dmg && ditto build/app/ShareDAW_artefacts/Release/ShareDAW.app dmg/ShareDAW.app && ln -s /Applications dmg/Applications
            hdiutil create -volname ShareDAW -srcfolder dmg -ov -format UDZO dist/ShareDAW.dmg
          else
            cp -r build/app/ShareDAW_artefacts/Release/ShareDAW build/app/ShareDAW_artefacts/Release/assets dist/
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ShareDAW-${{ matrix.name }}
          path: dist
          retention-days: 14
